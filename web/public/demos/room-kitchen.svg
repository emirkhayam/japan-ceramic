      <stop offset="0%" stop-color="#e6dfd4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e6dfd4" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e7c63" stop-opacity="1"/>
